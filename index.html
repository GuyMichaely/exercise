<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Beep Phases</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      color: #eee;
      /* Reduce synthetic delayed/duplicated click behavior on mobile */
      touch-action: manipulation;
    }

    body {
      background: #111;
    }

    body.exercise-on {
      background: #25562d;
    }

    body.done {
      background: #736732;
    }
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1rem;
      padding: 1rem;
    }
    #phase {
      font-size: 2rem;
      font-weight: bold;
    }
    #info {
      font-size: 0.95rem;
      opacity: 0.8;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="phase">Waiting for user interaction…</div>
    <div id="info">
      Click or tap anywhere (or the button) to enable audio and start.<br>
      Phase 1: 10× [on beep, 5s, off beep, 5s]<br>
      Phase 2: 2× [two quick on beeps, wait for click/tap, 45s]<br>
      Phase 3: 10× [on beep, 10s, off beep, 10s]
    </div>
  </div>


  <script>
    const ON_FREQ = 523.25;   // one octave above middle C (C5)
    const OFF_FREQ = 261.63;  // middle C (C4)
    const BEEP_DURATION = 0.2; // seconds (~200 ms)


    // High-level routine configuration (seconds)
    const timings = {
      phase1: { sets: 1, reps: 10, on: 5, off: 5 },
      phase2: { sets: 2, postClickWait: 45 },
      phase3: { sets: 1, reps: 10, on: 10, off: 10 },
    };


    // Rest between sets for phases 1 and 3 (seconds)
    const SET_REST_SECONDS = 60;


    // Global time scaling factor (set to 1 for real timings, < 1 for faster testing)
    const TIME_SCALE = 1; // e.g., 0.1 means 5s -> 0.5s


    let audioCtx = null;
    let started = false;


    const phaseEl = document.getElementById('phase');


    // Single gesture event to avoid double-fire on Pixel 6 (touch + synthetic click)
    // Pointer events are supported on modern Android/Chrome.
    // Use only 'click' everywhere.
    // On Pixel 6/Chrome, the double-trigger happens when you listen to BOTH touch and click.
    // Listening to click alone avoids the duplicate and is reliably treated as a user gesture for audio.
    const GESTURE_EVENT = 'click';


    function setExerciseOn(isOn) {
      document.body.classList.toggle('exercise-on', !!isOn);
    }


    function setPhaseText(text) {
      phaseEl.textContent = text;
    }

    function phaseStatusString(phaseName, currentSet, totalSets, extra = '') {
      let base = `${phaseName} – Set ${currentSet}/${totalSets}`;
      if (extra) base += ` – ${extra}`;
      return base;
    }

    // Sets the countdown text immediately (no intermediate label), then keeps it updated.
    function waitWithCountdown(seconds, baseText) {
      const render = (t) => setPhaseText(`${baseText} – ${t.toFixed(1)}s left`);
      render(seconds * TIME_SCALE);      // initial paint, immediately
      return waitWithSkip(seconds, render);
    }


    function setPhaseStatus(phaseName, currentSet, totalSets, extra = '') {
      let base = `${phaseName} – Set ${currentSet}/${totalSets}`;
      if (extra) base += ` – ${extra}`;
      setPhaseText(base);
      return base;
    }


    // Create and resume AudioContext strictly inside user gesture
    async function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }



    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }


    function toMs(seconds) {
      return seconds * 1000 * TIME_SCALE;
    }


    // Wait that can be fast-forwarded by a tap/click anywhere on the page
    function waitWithSkip(seconds, onTick) {
      const totalMs = toMs(seconds);

      return new Promise(resolve => {
        const start = performance.now();

        const tick = () => {
          const elapsed = performance.now() - start;
          const remainingMs = Math.max(0, totalMs - elapsed);
          if (onTick) onTick(remainingMs / 1000);
        };

        const intervalId = setInterval(tick, 100);
        tick();

        const handler = () => {
          cleanup();
          resolve();
        };

        const timeoutId = setTimeout(() => {
          cleanup();
          resolve();
        }, totalMs);

        function cleanup() {
          clearTimeout(timeoutId);
          clearInterval(intervalId);
          document.removeEventListener(GESTURE_EVENT, handler);
        }

        document.addEventListener(GESTURE_EVENT, handler);
      });
    }

    function fireAndForget(p) {
      // avoid unhandled rejection noise if something ever throws
      p?.catch?.(() => {});
    }

    function internalBeep(freq, duration, waveType, when = null) {
  if (!audioCtx) {
    console.warn('AudioContext not unlocked yet');
    return Promise.resolve();
  }

  if (!window.masterGain) {
    const mg = audioCtx.createGain();
    mg.gain.value = 1.0;

    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 30;
    comp.ratio.value = 8;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;

    mg.connect(comp);
    comp.connect(audioCtx.destination);
    window.masterGain = mg;
  }

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = waveType;
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(window.masterGain);

  const startAt = (when ?? audioCtx.currentTime);
  const endAt = startAt + duration;

  gain.gain.setValueAtTime(0, startAt);
  gain.gain.linearRampToValueAtTime(1.0, startAt + 0.005);
  if (duration > 0.01) {
    gain.gain.setValueAtTime(1.0, endAt - 0.005);
  }
  gain.gain.linearRampToValueAtTime(0.0, endAt);

  osc.start(startAt);
  osc.stop(endAt + 0.05);

  return new Promise(resolve => { osc.onended = resolve; });
}

function beep(freq, duration = BEEP_DURATION, when = null) {
  return internalBeep(freq, duration, 'sine', when);
}
function beepSquare(freq, duration = BEEP_DURATION, when = null) {
  return internalBeep(freq, duration, 'triangle', when);
}



    function waitForGesture() {
      return new Promise(resolve => {
        const handler = () => {
          document.removeEventListener(GESTURE_EVENT, handler);
          resolve();
        };
        document.addEventListener(GESTURE_EVENT, handler);
      });
    }


    async function runPhase1() {
  const { sets, reps, on, off } = timings.phase1;

  for (let s = 1; s <= sets; s++) {
    for (let r = 1; r <= reps; r++) {

      // ON segment
      setExerciseOn(true);
      const onBase = phaseStatusString('Phase 1', s, sets, `Rep ${r}/${reps} (on)`);
      const onWait = waitWithCountdown(on, onBase);  // countdown starts immediately
      fireAndForget(beep(ON_FREQ));                  // beep plays in parallel
      await onWait;

      // OFF segment
      setExerciseOn(false);
      const offBase = phaseStatusString('Phase 1', s, sets, `Rep ${r}/${reps} (off)`);
      const offWait = waitWithCountdown(off, offBase);
      fireAndForget(beep(OFF_FREQ));
      await offWait;
    }

    if (s < sets) {
      setExerciseOn(false);
      await waitWithCountdown(
        SET_REST_SECONDS,
        phaseStatusString('Phase 1', s, sets, `Resting ${SET_REST_SECONDS}s between sets`)
      );
    }
  }
}





    async function runPhase2() {
  const { sets, postClickWait } = timings.phase2;

  for (let s = 1; s <= sets; s++) {
    // Immediately show the real state (no "Beeps" step)
    setPhaseStatus('Phase 2', s, sets, 'Waiting for tap');
    setExerciseOn(true);

    // Schedule the two marker beeps without awaiting (no timing influence)
    const t0 = audioCtx.currentTime;
    beepSquare(ON_FREQ, 0.12, t0).catch(()=>{});
    beepSquare(ON_FREQ, 0.12, t0 + 0.125).catch(()=>{});

    // Now just wait for the user's tap
    await waitForGesture();

    // Then do the timed wait
    setExerciseOn(false);
    await waitWithCountdown(
      postClickWait,
      phaseStatusString('Phase 2', s, sets, `Waiting ${postClickWait}s`)
    );
  }
}

    async function playCMajorScale() {
      // C major scale from middle C up one octave
      const freqs = [
        261.63, // C4
        293.66, // D4
        329.63, // E4
        349.23, // F4
        392.0,  // G4
        440.0,  // A4
        493.88, // B4
        523.25, // C5
      ];
      for (const f of freqs) {
        await beep(f, 0.135);
      }
    }


    async function runPhase3() {
      const { sets, reps, on, off } = timings.phase3;

      for (let s = 1; s <= sets; s++) {
        for (let r = 1; r <= reps; r++) {

          setExerciseOn(true);
          const onBase = phaseStatusString('Phase 3', s, sets, `Rep ${r}/${reps} (on)`);
          const onWait = waitWithCountdown(on, onBase);
          fireAndForget(beep(ON_FREQ));
          await onWait;

          const isLastRep = (s === sets && r === reps);
    if (isLastRep) {
      setExerciseOn(true);     // keep green during the final scale
      playCMajorScale(); // still audible
    } else {
      setExerciseOn(false);
      const offBase = phaseStatusString('Phase 3', s, sets, `Rep ${r}/${reps} (off)`);
      const offWait = waitWithCountdown(off, offBase);
      beep(OFF_FREQ).catch(()=>{});
      await offWait;
    }

        }

        if (s < sets) {
          setExerciseOn(false);
          await waitWithCountdown(
            SET_REST_SECONDS,
            phaseStatusString('Phase 3', s, sets, `Resting ${SET_REST_SECONDS}s between sets`)
          );
        }
      }
    }






    async function runPhases() {
      await runPhase1();
      await runPhase2();
      await runPhase3();
      setPhaseText('Done');
      document.body.classList.add('done');
      document.body.classList.remove('exercise-on');
    }


    async function startSequence(e) {
      if (started) return;
      started = true;

      // Prevent this *starting* click from also being treated as a "skip" click.
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      await unlockAudio();
      setExerciseOn(false);
      setPhaseText('Starting…');

      // Defer so the initial click event fully finishes before waits attach listeners.
      setTimeout(() => {
        runPhases().catch(err => console.error(err));
      }, 0);
    }
    // Also allow tapping anywhere to start (matches the instructions on-screen)
    document.addEventListener(GESTURE_EVENT, startSequence, { once: true, capture: true });
  </script>
</body>
</html>
